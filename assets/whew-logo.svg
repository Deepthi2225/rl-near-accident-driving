<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-label="WHEW! - reinforcement learning for near-accident driving">
  <title>WHEW!</title>
  <style>
    .ink    { stroke: #1b1f24; }
    .accent { stroke: #e8452c; }
    .dot    { fill: #e8452c; }
    .glow   { fill: #e8452c; opacity: .18; }
    .speed  { stroke: #e8452c; opacity: .55; }
    .tag    { fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #f0f3f6; }
      .accent { stroke: #ff5a3c; }
      .dot, .glow { fill: #ff5a3c; }
      .speed { stroke: #ff5a3c; }
      .tag { fill: #9da7b3; }
    }
  </style>
  <defs>
    <clipPath id="cap"><rect x="-80" y="0" width="560" height="100"/></clipPath>
  </defs>

  <!-- wordmark: letters drawn on a 100-unit cap height, leaning forward -->
  <g transform="translate(118 28) skewX(-12)">
    <g fill="none" stroke-width="22" stroke-linejoin="miter" stroke-miterlimit="10" clip-path="url(#cap)">
      <!-- speed lines -->
      <g class="speed" stroke-width="7" stroke-linecap="round">
        <line x1="-74" y1="30" x2="-22" y2="30"/>
        <line x1="-58" y1="52" x2="-22" y2="52"/>
        <line x1="-44" y1="74" x2="-22" y2="74"/>
      </g>
      <!-- W -->
      <polyline class="ink" points="2,-20 26,100 50,35 74,100 98,-20"/>
      <!-- H -->
      <g class="ink" transform="translate(114 0)">
        <line x1="11" y1="-20" x2="11" y2="120"/>
        <line x1="69" y1="-20" x2="69" y2="120"/>
        <line x1="11" y1="50" x2="69" y2="50"/>
      </g>
      <!-- E -->
      <g class="ink" transform="translate(208 0)">
        <line x1="11" y1="-20" x2="11" y2="120"/>
        <line x1="11" y1="11" x2="70" y2="11"/>
        <line x1="11" y1="50" x2="60" y2="50"/>
        <line x1="11" y1="89" x2="70" y2="89"/>
      </g>
      <!-- W -->
      <polyline class="ink" transform="translate(292 0)" points="2,-20 26,100 50,35 74,100 98,-20"/>
      <!-- ! bar -->
      <line class="accent" x1="419" y1="-20" x2="419" y2="66"/>
    </g>
    <!-- ! dot = brake light -->
    <circle class="glow" cx="419" cy="89" r="19"/>
    <circle class="dot" cx="419" cy="89" r="11"/>
  </g>

  <text class="tag" x="320" y="172" text-anchor="middle"
        font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="15" font-weight="600" letter-spacing="3.2">REINFORCEMENT LEARNING FOR NEAR-ACCIDENT DRIVING</text>
</svg>
